<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>New Blood Request</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="bg-light">


<nav class="navbar navbar-dark bg-danger">

    <div class="container">

        <span class="navbar-brand fw-bold">
            🩸 Blood Bank Management
        </span>

        <a
            href="{{ url_for('blood_requests') }}"
            class="btn btn-light btn-sm">

            Back

        </a>

    </div>

</nav>


<div class="container py-5">

    <div class="card shadow border-0">

        <div class="card-header bg-danger text-white">

            <h4 class="mb-0">
                📋 New Blood Request
            </h4>

        </div>


        <div class="card-body">

            <form method="POST">


                <div class="mb-3">

                    <label class="form-label">
                        Patient
                    </label>

                    <select
                        name="patient_id"
                        class="form-select"
                        required>

                        <option value="">
                            Select Patient
                        </option>

                        {% for patient in patients %}

                        <option
                            value="{{ patient.id }}">

                            {{ patient.name }}
                            -
                            {{ patient.blood_group }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="row">


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Blood Group
                        </label>

                        <select
                            name="blood_group"
                            class="form-select"
                            required>

                            <option value="">
                                Select
                            </option>

                            <option>A+</option>
                            <option>A-</option>
                            <option>B+</option>
                            <option>B-</option>
                            <option>AB+</option>
                            <option>AB-</option>
                            <option>O+</option>
                            <option>O-</option>

                        </select>

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Units Required
                        </label>

                        <input
                            type="number"
                            name="units_required"
                            class="form-control"
                            min="1"
                            required>

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Hospital
                        </label>

                        <input
                            type="text"
                            name="hospital"
                            class="form-control"
                            required>

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn btn-danger">

                    Submit Request

                </button>


                <a
                    href="{{ url_for('blood_requests') }}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
