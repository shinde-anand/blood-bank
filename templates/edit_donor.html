<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Donor</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="bg-light">


<nav class="navbar navbar-dark bg-danger">

    <div class="container">

        <span class="navbar-brand fw-bold">
            🩸 Blood Bank Management
        </span>

        <a
            href="{{ url_for('donors') }}"
            class="btn btn-light btn-sm">

            Back

        </a>

    </div>

</nav>


<div class="container py-5">

    <div class="card shadow border-0">

        <div class="card-header bg-danger text-white">

            <h4 class="mb-0">
                ✏️ Edit Donor
            </h4>

        </div>


        <div class="card-body">

            <form method="POST">

                <div class="row">


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ donor.name }}"
                            required>

                    </div>


                    <div class="col-md-3 mb-3">

                        <label class="form-label">
                            Age
                        </label>

                        <input
                            type="number"
                            name="age"
                            class="form-control"
                            value="{{ donor.age }}"
                            required>

                    </div>


                    <div class="col-md-3 mb-3">

                        <label class="form-label">
                            Gender
                        </label>

                        <select
                            name="gender"
                            class="form-select">

                            <option value="Male"
                                {% if donor.gender == "Male" %}selected{% endif %}>
                                Male
                            </option>

                            <option value="Female"
                                {% if donor.gender == "Female" %}selected{% endif %}>
                                Female
                            </option>

                            <option value="Other"
                                {% if donor.gender == "Other" %}selected{% endif %}>
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Blood Group
                        </label>

                        <select
                            name="blood_group"
                            class="form-select">

                            {% for group in ["A+", "A-", "B+", "B-", "AB+", "AB-", "O+", "O-"] %}

                                <option
                                    value="{{ group }}"
                                    {% if donor.blood_group == group %}selected{% endif %}>

                                    {{ group }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            type="tel"
                            name="phone"
                            class="form-control"
                            value="{{ donor.phone }}">

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ donor.email }}">

                    </div>


                    <div class="col-md-8 mb-3">

                        <label class="form-label">
                            Address
                        </label>

                        <input
                            type="text"
                            name="address"
                            class="form-control"
                            value="{{ donor.address }}">

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Last Donation Date
                        </label>

                        <input
                            type="date"
                            name="last_donation_date"
                            class="form-control"
                            value="{{ donor.last_donation_date }}">

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn btn-danger">

                    Update Donor

                </button>


                <a
                    href="{{ url_for('donors') }}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
